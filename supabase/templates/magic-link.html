<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      background: #f5f5f3;
      color: #111;
      font-family: Arial, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background: #fff;
              border: 1px solid #e7e7e3;
              border-radius: 14px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 13px;
                    font-weight: 700;
                    letter-spacing: 0.14em;
                  "
                >
                  SHOPIFIND
                </p>
                <h1
                  style="margin: 0 0 16px; font-size: 26px; line-height: 1.25"
                >
                  Accede a Shopifind
                </h1>
                <p style="margin: 0 0 24px; color: #444; line-height: 1.6">
                  Abre la página segura de Shopifind y confirma el acceso en el
                  dispositivo que estés usando.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;redirect_to={{ .RedirectTo }}"
                    style="
                      display: inline-block;
                      background: #111;
                      color: #fff;
                      text-decoration: none;
                      border-radius: 8px;
                      padding: 13px 20px;
                      font-weight: 700;
                    "
                  >
                    Continuar en Shopifind
                  </a>
                </p>
                <p
                  style="
                    margin: 0 0 8px;
                    color: #666;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  El enlace es de un solo uso y caduca pronto.
                </p>
                <p
                  style="
                    margin: 0;
                    color: #666;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Si no lo has solicitado, puedes ignorar este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
